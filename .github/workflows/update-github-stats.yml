name: Update GitHub portfolio stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-portfolio-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub statistics
        run: node scripts/update-github-stats.mjs
        env:
          GITHUB_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GITHUB_USERNAME: Carloseduardo-dev
          INCLUDE_PRIVATE: ${{ secrets.GH_STATS_TOKEN != '' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/github-stats.json
          if git diff --cached --quiet; then
            echo "No statistics changed."
            exit 0
          fi
          git commit -m "chore: update GitHub portfolio stats"
          git push
